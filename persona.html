<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- A/B: this is the "persona" landing variant's static shell. The edge middleware sets this meta
         tag on rewrite so the client (src/ab.ts) knows which variant it is without a flash. -->
    <meta name="mf-variant" content="persona" />

    <!-- Primary Meta Tags -->
    <title>Maximiliano Bustamante | CTO & Shopify Tech Lead</title>
    <meta name="title" content="Maximiliano Bustamante | CTO & Shopify Tech Lead" />
    <meta name="description" content="CTO & Shopify Tech Lead at Digitdeck. 18+ Shopify storefronts, a production app suite, and the delivery system behind them. Open for Shopify CRO consulting." />
    <meta name="keywords" content="Shopify Developer, Shopify Tech Lead, Shopify CRO, Liquid, React, Remix, Shopify Functions, Shopify Apps, E-commerce, CTO, Medellín, Colombia" />
    <meta name="author" content="Maximiliano Bustamante" />
    <meta name="robots" content="index, follow" />
    <meta name="language" content="English" />

    <!-- Canonical URL: the persona variant lives at /arcade -->
    <link rel="canonical" href="https://www.maxfolio.dev/arcade" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon-persona.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon-persona.svg" />

    <!-- Theme Color -->
    <meta name="theme-color" content="#eef3f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#111013" media="(prefers-color-scheme: dark)" />
    <meta name="msapplication-TileColor" content="#0a0f1a" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.maxfolio.dev/arcade" />
    <meta property="og:title" content="Maximiliano Bustamante | CTO & Shopify Tech Lead" />
    <meta property="og:description" content="18+ Shopify storefronts, a production app suite, and the delivery system behind them. Open for Shopify CRO consulting." />
    <meta property="og:image" content="https://www.maxfolio.dev/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="es_CO" />
    <meta property="og:locale:alternate" content="ja_JP" />
    <meta property="og:site_name" content="Maxfolio" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://www.maxfolio.dev/arcade" />
    <meta name="twitter:title" content="Maximiliano Bustamante | CTO & Shopify Tech Lead" />
    <meta name="twitter:description" content="18+ Shopify storefronts, a production app suite, and the delivery system behind them. Open for Shopify CRO consulting." />
    <meta name="twitter:image" content="https://www.maxfolio.dev/og-image.png" />

    <!-- Preconnect to external domains for performance -->
    <link rel="preload" href="/locales/en.json" as="fetch" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- DNS Prefetch -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />

    <!-- Google Fonts for the Persona (Arcade) theme: Anton display slabs, Rajdhani condensed labels.
         Loaded without blocking first paint — the print/onload swap trick used on every other entry. -->
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
    <noscript><link href="https://fonts.googleapis.com/css2?family=Anton&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet" /></noscript>
  </head>
  <body>
    <!-- Skip to main content link for accessibility -->
    <a href="#main-content" class="skip-link">Skip to main content</a>

    <div id="root">
      <!-- Static menu shell: the same arcade-menu nodes React's Persona entry screen renders first, so
           the largest paint does not wait for the bundle. React's first commit replaces it. -->
      <div class="theme-persona min-h-screen font-sf bg-[#eef3f7] text-[#0a0f1a] [overflow-x:clip]" data-shell>
        <div class="fixed top-0 inset-x-0 z-40 h-12 md:h-14 bg-[#eef3f7]/90 border-b border-[#0a0f1a]/10" aria-hidden="true"></div>
        <main class="pt-12 md:pt-14 pb-16">
          <section class="relative min-h-[calc(100svh-3rem)] md:min-h-[calc(100svh-3.5rem)] flex flex-col justify-center px-2 sm:px-4 py-10 overflow-hidden">
            <div aria-hidden="true" class="persona-shell-ghost">MB</div>
            <div class="relative z-10 max-w-4xl mx-auto w-full">
              <p class="font-persona-label text-xs font-semibold uppercase tracking-[0.35em] text-[#1c6fb0] mb-4 px-4 md:px-7" data-t="brand">— Maximiliano Bustamante</p>
              <nav aria-label="Arcade menu">
                <a href="#home" class="persona-shell-item" data-t="home">01&nbsp;&nbsp;Home</a>
                <a href="#work" class="persona-shell-item" data-t="work">02&nbsp;&nbsp;Work</a>
                <a href="#years" class="persona-shell-item" data-t="years">03&nbsp;&nbsp;Years</a>
                <a href="#skills" class="persona-shell-item" data-t="skills">04&nbsp;&nbsp;Skills</a>
                <a href="#contact" class="persona-shell-item" data-t="contact">05&nbsp;&nbsp;Contact</a>
              </nav>
            </div>
          </section>
        </main>
      </div>
    </div>
    <script>
      (function () {
        try {
          var L = {
            es: { brand: '— Maximiliano Bustamante', home: '01  Inicio', work: '02  Trabajo', years: '03  Años', skills: '04  Habilidades', contact: '05  Contacto' },
            ja: { brand: '— Maximiliano Bustamante', home: '01  ホーム', work: '02  仕事', years: '03  沿革', skills: '04  スキル', contact: '05  連絡先' }
          };
          var saved = localStorage.getItem('lang');
          var nav = (navigator.language || '').toLowerCase();
          var lang = saved || (nav.indexOf('es') === 0 ? 'es' : nav.indexOf('ja') === 0 ? 'ja' : 'en');
          var s = L[lang];
          if (s) {
            document.documentElement.lang = lang;
            var nodes = document.querySelectorAll('#root [data-t]');
            for (var i = 0; i < nodes.length; i++) { var v = s[nodes[i].getAttribute('data-t')]; if (v) nodes[i].textContent = v; }
          }
          if (localStorage.getItem('persona-theme') === 'dark') {
            var r = document.querySelector('#root [data-shell]');
            if (r) { r.classList.remove('bg-[#eef3f7]', 'text-[#0a0f1a]'); r.classList.add('bg-[#111013]', 'text-[#f5f2ee]'); }
            var bar = document.querySelector('#root [data-shell] > div');
            if (bar) { bar.classList.remove('bg-[#eef3f7]/90', 'border-[#0a0f1a]/10'); bar.classList.add('bg-[#111013]/90', 'border-[#f5f2ee]/10'); }
          }
        } catch (e) {}
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>

    <!-- Inline critical CSS: skip link + the handful of shell-only rules the static hero needs before
         the Persona route's own stylesheet (src/styles/persona.css) can load. -->
    <style>
      .skip-link {
        position: absolute;
        top: -100px;
        left: 0;
        background: #000;
        color: #fff;
        padding: 8px 16px;
        z-index: 10000;
        text-decoration: none;
        font-family: system-ui, -apple-system, sans-serif;
        font-size: 14px;
        transition: top 0.2s;
      }
      .skip-link:focus {
        top: 0;
        outline: 2px solid #1c6fb0;
        outline-offset: 2px;
      }
      .persona-shell-ghost {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        pointer-events: none;
        user-select: none;
        overflow: hidden;
        font-family: 'Anton', 'Archivo Black', sans-serif;
        font-size: 22vw;
        line-height: 1;
        opacity: 0.05;
        mix-blend-mode: overlay;
        white-space: nowrap;
      }
      .persona-shell-item {
        display: block;
        font-family: 'Anton', 'Archivo Black', sans-serif;
        font-style: oblique 6deg;
        text-transform: uppercase;
        text-decoration: none;
        color: inherit;
        line-height: 0.9;
        padding: 0.75rem 1.75rem;
        font-size: 9vw;
      }
      @media (min-width: 768px) {
        .persona-shell-item {
          font-size: 6.4vw;
        }
      }
    </style>
  </body>
</html>
